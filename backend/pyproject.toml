[project]
name = "billmax"
version = "0.1.0"
description = "ISP billing system for Kenyan internet service providers"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
