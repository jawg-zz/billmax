<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; color: #333; line-height: 1.6; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { background: #059669; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
    .body { padding: 24px 20px; background: #f9fafb; }
    .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    .card h2 { margin: 0 0 12px; font-size: 16px; color: #059669; }
    .field { margin-bottom: 8px; }
    .label { color: #888; font-size: 12px; }
    .value { font-weight: 500; }
    .footer { text-align: center; padding: 20px; color: #999; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>New Customer Registration</h2>
    </div>
    <div class="body">
      <div class="card">
        <h2>{{ customer_name }}</h2>
        <div class="field"><div class="label">Phone</div><div class="value">{{ phone }}</div></div>
        <div class="field"><div class="label">Email</div><div class="value">{{ email }}</div></div>
        <div class="field"><div class="label">Selected Plan</div><div class="value">{{ plan_name }}</div></div>
        <div class="field"><div class="label">Organization</div><div class="value">{{ org_name }}</div></div>
      </div>
      <p style="text-align: center; color: #888; font-size: 13px;">
        Log in to the admin panel to approve this registration.
      </p>
    </div>
    <div class="footer">
      <p>{{ org_name }}</p>
    </div>
  </div>
</body>
</html>
